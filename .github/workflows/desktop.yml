name: Desktop release

# Builds the version-stamped desktop installers whenever a version tag is
# pushed, and attaches them to the GitHub Release with checksums. Unsigned
# builds are for internal/MDM distribution; signing is timed to the first
# external user. Asset names are a contract with the updater — see the
# updater plan — so the rename steps below are load-bearing, not cosmetic.
#
# Nothing here caches, deliberately. A tag ref can only read caches created for
# that same tag, and a tag is built once, so a cache saved here is unreadable by
# the next tag and by every pull request. Observed on the v0.9.1 run: every job
# reported "Cache is not found" for both Go and npm, and then saved anyway --
# roughly 2.4 GB per release of entries nothing can ever restore, against a 10 GB
# repository budget. That eviction pressure is what was clearing out the Linux
# cache that makes pull requests fast (see pr.yml), so the tag builds now pay
# their own compile instead. They are rare; a few minutes here is cheaper than a
# cold six-minute gate on every PR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncacheable from a tag ref; see the note at the top of this file.
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Uncacheable from a tag ref; see the note at the top of this file.

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install NSIS
        # windows-latest does not ship makensis; without it `wails build
        # -nsis` compiles the exe but cannot package the installer. The
        # choco package drops no PATH entry, so export it explicitly.
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build installer
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-windows.sh

      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/bin
          sha256sum Vera-${{ github.ref_name }}-windows-amd64-installer.exe > Vera-${{ github.ref_name }}-windows-amd64-installer.exe.sha256
          gh release upload "${{ github.ref_name }}" \
            Vera-${{ github.ref_name }}-windows-amd64-installer.exe \
            Vera-${{ github.ref_name }}-windows-amd64-installer.exe.sha256 \
            --clobber

  windows-arm64:
    name: Windows ARM64 installer
    # Native ARM64 build: cross-compiling the WebView2 CGO layer from an
    # amd64 runner is unsupported, so this rides the windows-11-arm runner
    # with the same steps as the amd64 job.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncacheable from a tag ref; see the note at the top of this file.
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Uncacheable from a tag ref; see the note at the top of this file.

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install NSIS
        # Same as the amd64 job: the runner has no makensis, and the choco
        # package drops no PATH entry, so export it explicitly.
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build installer
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-windows-arm64.sh

      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/bin
          sha256sum Vera-${{ github.ref_name }}-windows-arm64-installer.exe > Vera-${{ github.ref_name }}-windows-arm64-installer.exe.sha256
          gh release upload "${{ github.ref_name }}" \
            Vera-${{ github.ref_name }}-windows-arm64-installer.exe \
            Vera-${{ github.ref_name }}-windows-arm64-installer.exe.sha256 \
            --clobber

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncacheable from a tag ref; see the note at the top of this file.
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Uncacheable from a tag ref; see the note at the top of this file.

      - name: Install Wails CLI and create-dmg
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          brew install create-dmg

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build disk image
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-macos.sh

      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/bin
          shasum -a 256 Vera-${{ github.ref_name }}-macos-universal.dmg > Vera-${{ github.ref_name }}-macos-universal.dmg.sha256
          gh release upload "${{ github.ref_name }}" \
            Vera-${{ github.ref_name }}-macos-universal.dmg \
            Vera-${{ github.ref_name }}-macos-universal.dmg.sha256 \
            --clobber

  cli:
    name: vera CLI
    # One Linux runner builds every target: the CLI imports the application but
    # links no cgo (backend/render is pure Go, and Wails' pkg/runtime is too), so
    # cross-compilation needs nothing the runner lacks. Checked before this job
    # existed -- all six targets build with CGO_ENABLED=0, and the amd64 binary
    # runs and reports its version.
    #
    # Six plain binaries rather than a macOS universal: making one needs lipo,
    # which is not on a Linux runner, and a CLI user picking their own
    # architecture is ordinary (`uname -m`).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncacheable from a tag ref; see the note at the top of this file.
          cache: false

      - name: Resolve the version stamp
        id: stamp
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # stamp-version.sh is the one place that decides what a version means,
          # and it fails loudly when wails.json and the tag disagree. It exports
          # LDFLAGS into its own process, so the value is re-derived here rather
          # than copied by hand -- two spellings of a version is how they drift.
          ./scripts/stamp-version.sh
          echo "ldflags=-X vera-app/backend.AppVersion=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build every target
        env:
          LDFLAGS: ${{ steps.stamp.outputs.ldflags }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          mkdir -p build/cli
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="Vera-CLI-${VERSION}-${os}-${arch}"
            [ "$os" = "windows" ] && name="${name}.exe"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "build/cli/$name" ./cmd/vera
          done
          ls -l build/cli

      - name: Prove the binaries carry this release's version
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          # Running every binary is impossible on one runner, but ldflags writes
          # the version into the file as a plain string, so searching for it
          # catches the real failure: a build that was stamped with something
          # else, or not stamped at all.
          for binary in build/cli/*; do
            if ! grep -qaF "$VERSION" "$binary"; then
              echo "::error::$binary does not carry $VERSION; it was not stamped"
              exit 1
            fi
          done
          # And one of them actually runs here, so "it built" is not the only
          # thing being asserted.
          amd64="build/cli/Vera-CLI-${VERSION}-linux-amd64"
          reported=$("$amd64" version)
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::vera version reported '$reported', want '$VERSION'"
            exit 1
          fi
          echo "all six binaries carry $VERSION, and linux-amd64 runs"

      - name: Checksum and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd build/cli
          for binary in *; do
            sha256sum "$binary" > "$binary.sha256"
          done
          gh release upload "${{ github.ref_name }}" ./* --clobber

  announce:
    name: Announce to the updater
    # Last, and only once all three installers are on the release. The updater
    # learns about releases from six VERA_APP_* variables on the vera-api Cloud
    # Run service and nothing else announces anything -- not the tag, not the
    # GitHub Release. v0.4.0 shipped without this step existing and the app went
    # on offering v0.3.5 until a user reported it, so the step is now automatic
    # and fails loudly rather than being remembered.
    needs: [windows, windows-arm64, macos, cli]
    runs-on: ubuntu-latest
    # Least privilege for this job: read the release assets, mint a WIF token.
    permissions:
      contents: read
      id-token: write
    # Two tags in quick succession would race on the same Cloud Run env vars.
    concurrency:
      group: announce-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Decide whether this tag should be announced
        id: announce
        run: |
          # A pre-release tag gets its installers built and attached, but must
          # not be pushed to every installed desktop. This is a deliberate skip,
          # not a failure: unlike missing credentials below, nothing is broken
          # and the release is still doing what it was cut for.
          if [[ "${{ github.ref_name }}" =~ -[0-9A-Za-z.-]+$ ]]; then
            echo "::notice::ref_name ${{ github.ref_name }} is a pre-release; building only, not announcing to all installed copies."
            echo "should=false" >> "$GITHUB_OUTPUT"
          else
            echo "should=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the updater credentials are configured
        if: steps.announce.outputs.should == 'true'
        run: |
          # Fails here rather than skipping, deliberately. deploy.yml skips
          # cleanly when its secrets are absent because nothing breaks if the
          # API is not redeployed. Here, skipping is the exact bug being fixed:
          # a release that reaches staff with no announcement anywhere, and no
          # signal that the announce step did not happen.
          for secret in GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!secret}" ]; then
              echo "::error::$secret is not set, so this release cannot be announced. The installers are on the release, but no installed copy will be told about them."
              echo "See docs/api-deploy.md for the one-time WIF setup."
              exit 1
            fi
          done
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Checkout
        if: steps.announce.outputs.should == 'true'
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        if: steps.announce.outputs.should == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Check the tools the announce script needs
        if: steps.announce.outputs.should == 'true'
        run: |
          # Named up front so a runner-image change surfaces as "gcloud is
          # missing" rather than a confusing failure from inside the script.
          missing=""
          for tool in gh gcloud jq curl; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::runner image is missing:$missing"
            exit 1
          fi

      - name: Mirror installers and point the updater at this release
        if: steps.announce.outputs.should == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: ./scripts/announce-release.sh --version "${{ github.ref_name }}"
