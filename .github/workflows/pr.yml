name: Gates

# Runs on pull requests AND on main.
#
# The main trigger is not just post-merge validation: it is what makes the PR
# runs fast. GitHub scopes caches per ref, and a pull request can only read its
# own ref's caches and the default branch's. With nothing ever running on main,
# there was no default-branch Go cache to inherit, so every PR compiled the
# entire race-instrumented dependency graph from scratch -- about 4.5 of the
# 6 minutes the job took.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Interleaved pushes to one PR otherwise run the full race suite in parallel
# with the run the previous push started. Only the latest commit can merge, so
# superseded runs are cancelled rather than finishing out of spite. Keyed by
# PR number: different PRs never cancel each other.
#
# A push to main has no PR number, so the group falls back to the ref -- without
# it every main run would share the group "gates-" and cancel the others. And a
# main run is never cancelled: the cache is saved at the end of it, so cancelling
# one throws away the very thing that makes the next PR fast, on top of the only
# run that validates what just shipped.
concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go gates
    # A hung job otherwise runs the 360-minute default before anyone is told.
    # The Postgres-backed suites (backend/api, backend/store, plus the PO
    # schema-per-test cases) now take ~20 minutes cold on a hosted runner, so a
    # 20-minute cap kills a healthy run mid-suite. Keep the job cap above the
    # `go test -timeout 30m` budget; this is a hang tripwire, not a stopwatch.
    timeout-minutes: 45
    # Pinned, not ubuntu-latest. The runner image is part of the setup-go cache
    # key, so the migration to Ubuntu 26 (beginning 2026-10-19) would cold-start
    # every job on the day it rolls out. Here the durability fix is the speed fix.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: quotes
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d quotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERA_POSTGRES_TEST_DSN: postgres://vera:secret@localhost:55432/quotes?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the scope step below diffs the PR against its merge
          # base, which needs the base commit to be present locally.
          fetch-depth: 0

      - name: Decide whether the Go suite needs to run
        # Skips the heavy steps ONLY for a diff that is entirely frontend UI
        # source; every other path -- root *.md (the changelog-copy test),
        # backend/** (embeds frontend/dist), configs, workflows -- keeps the
        # full suite. The heavy steps run unless this step explicitly writes
        # needs_go=false, so a crashed or confused filter fails OPEN: the
        # worst case is an unnecessary full run, never a false green.
        id: scope
        continue-on-error: true
        run: |
          # A push to main always runs the full suite. There is no merge base to
          # diff against, and main is the branch every PR inherits its cache
          # from, so it has to be seeded with the whole thing rather than a
          # subset. This used to happen by accident -- the empty base made git
          # fail, and continue-on-error hid it -- which is not a behaviour worth
          # depending on.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: running the full suite"
            echo "needs_go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          files="$(git diff --no-renames --name-only "$base"...HEAD)"
          echo "changed files:"; printf '%s\n' "$files"
          needs_go=true
          if [ -n "$files" ]; then
            # skip only when EVERY changed path is frontend UI source;
            # --no-renames makes a rename two paths, so a move out of
            # frontend/src cannot sneak through as one matching path.
            if ! printf '%s\n' "$files" | grep -qvE '^frontend/(src|public)/'; then
              needs_go=false
            fi
          fi
          echo "Go suite runs: $needs_go"
          echo "needs_go=$needs_go" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches
        # Explicit, rather than setup-go's built-in cache, for two reasons.
        #
        # It has restore-keys. setup-go v6 calls
        # cache.restoreCache(cachePaths, primaryKey) with no third argument, so
        # its key -- which hashes go.sum -- is an exact match only. Any
        # dependency bump therefore compiled the world from scratch, which made
        # Dependabot's PRs the slowest ones in the repo. Go's build cache is
        # content-addressed, so a nearest-match restore is exactly right:
        # unchanged packages are reused and only genuinely-changed ones rebuild.
        #
        # And it is saved from one place. See the save step at the bottom.
        id: go-cache
        if: steps.scope.outputs.needs_go != 'false'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Set up Node
        if: steps.scope.outputs.needs_go != 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.scope.outputs.needs_go != 'false'
        run: npm --prefix frontend ci

      - name: Build frontend (required for go:embed)
        if: steps.scope.outputs.needs_go != 'false'
        run: npm --prefix frontend run build

      - name: Set up Go
        if: steps.scope.outputs.needs_go != 'false'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The cache steps above own this now. Leaving it on would save a
          # second copy on every ref, which is how the repo reached 11.3 GB
          # against a 10 GB budget and started evicting the entries PRs need.
          cache: false

      - name: gofmt check
        if: steps.scope.outputs.needs_go != 'false'
        run: test -z "$(gofmt -l .)"

      - name: go vet
        if: steps.scope.outputs.needs_go != 'false'
        run: go vet ./...

      - name: API configuration and session build modes (#495)
        # The development API resolver and the dev keychain identity are
        # //go:build dev && !production variants, and the ordinary suite never
        # compiles them: without this step a broken dev branch stays invisible
        # until someone runs `wails dev`.
        #
        # Root package covers default, packaged, dev and debug-packaged. The
        # Wails-free auth package covers those plus dev+production, which pins
        # the exclusive predicate (dev && !production versus !dev || production).
        # Wails v2.16 itself declares App twice when both tags are set, so the
        # dev+production root package cannot link; auth is where that
        # combination is executable.
        if: steps.scope.outputs.needs_go != 'false'
        run: |
          go vet -tags dev ./ ./backend/auth
          go test -count=1 -run 'TestAPIBaseURL|TestProductionAPIURL|TestKeyringIdentity' ./ ./backend/auth
          for tags in production dev production,debug; do
            go test -tags "$tags" -count=1 \
              -run 'TestAPIBaseURL|TestProductionAPIURL|TestKeyringIdentity' ./ ./backend/auth
          done
          go test -tags dev,production -count=1 \
            -run 'TestKeyringIdentity' ./backend/auth

      - name: Build the chromedp tag (the renderer-equivalence oracle)
        # The default suite never builds this tag, so without this step the
        # oracle's adapter could rot while everything else stays green --
        # dependency drift that fails silently (issue #385). go vet compiles
        # the test files too, so the oracle's own sources cannot rot either.
        if: steps.scope.outputs.needs_go != 'false'
        run: |
          go build -tags chromedp ./...
          go vet -tags chromedp ./...

      - name: Install PostgreSQL client (matches service version)
        # The restore drill test shells out to pg_dump/pg_restore, which
        # refuse to talk to a newer server — the client major must be 18.
        # Noble has no PG18 package, so take it from PGDG like the image.
        if: steps.scope.outputs.needs_go != 'false'
        run: |
          sudo apt-get install -y -qq curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18

      - name: go test with race detector
        # No -short.
        #
        # It used to skip TestGeneratePDF for want of a Chrome sandbox, but since
        # v0.4.0 the active renderer is native Go (render.Active is gpdf), so
        # nothing needs a browser. The flag bought 611ms by excluding the only
        # end-to-end export test in the Go suite -- the one that builds a
        # quotation and produces real PDF bytes, which is exactly the path a
        # broken renderer would break.
        #
        # The 10m timeout is go test's per-package default, and backend/api's
        # Postgres-backed suite now passes it on a hosted runner (the PO work
        # added several schema-per-test suites). A package timeout is reported
        # as a deadlock dump, which reads like a hang rather than a slow suite;
        # give the suite headroom instead of misdiagnosing it as one.
        if: steps.scope.outputs.needs_go != 'false'
        run: go test -race -timeout 30m ./...

      - name: Prove the export test actually ran
        # A green tick cannot distinguish a test that ran from one that skipped,
        # and go test exits 0 either way -- which is how -short hid this test for
        # two minor versions without anyone noticing. So the fact is asserted
        # rather than inferred: re-run just this test, verbosely, and fail unless
        # it reports a pass.
        if: steps.scope.outputs.needs_go != 'false'
        run: |
          go test ./backend -run TestGeneratePDF -count=1 -v \
            | grep -q -- "--- PASS: TestGeneratePDF"
          echo "TestGeneratePDF ran and passed."

      - name: Save the Go caches
        # main only, and only when the primary key missed.
        #
        # main only: a cache saved under a pull request's ref is readable by that
        # PR and nothing else, so saving there spends the budget on entries no
        # other run can use. Every PR reads main's instead.
        #
        # The cache-hit guard: actions/cache/restore reports a hit only on an
        # exact primary-key match, so a restore-key match still saves here while
        # an exact hit skips -- which is what avoids the duplicate-key error
        # actions/cache/save raises when the key already exists.
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.scope.outputs.needs_go != 'false' &&
          steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod

  frontend:
    name: Frontend build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # Narrowed, not defaulted. Checkout needs contents; the Dependabot step
    # below needs security-events. Declaring both keeps the grant
    # least-privilege -- naming any scope zeroes the rest, so contents has to
    # be listed explicitly. Kept off the Go job deliberately: its cache
    # restore/save steps keep whatever token they have today.
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Type-check and build
        run: npm --prefix frontend run build

      # The pure logic in the React layer is executable and was silently
      # untested: the draft payload parser, the release-notes parser and the
      # live pricing that duplicates the backend. This is a required check, so
      # a change to one of those cannot pass review on the strength of the Go
      # suite alone.
      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Report Dependabot alerts
        # Repository hygiene, not frontend work: it lives in this job because
        # this job runs unconditionally on every PR and main push, while the
        # Go job's heavy steps are skipped for frontend-only diffs.
        #
        # The automated half of the AGENTS.md section 11 Dependabot reads. The
        # open alert list lands in the job summary without anyone typing
        # anything. It fails ONLY on a successful read that contains a
        # critical or high alert; anything else is reported without failing.
        # Every API failure -- bad permission, rate limit, network, an
        # unexpected response shape -- fails OPEN (warn and exit 0), like the
        # scope step in the Go job: a blind check must never block a PR. Read
        # the summary on green, not just the tick: green means "no
        # critical/high alerts" or "the query failed and this check saw
        # nothing".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub runs this step under `bash -e` (errexit): any failing
          # command would abort the script before its own fail-open handling
          # below can run. Disable errexit so the explicit status checks
          # govern; only a successful critical/high read may fail the job.
          set +e
          set -u
          alerts="$(mktemp)"
          apierr="$(mktemp)"
          trap 'rm -f "$alerts" "$apierr"' EXIT
          gh api --paginate "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" >"$alerts" 2>"$apierr"
          gh_status=$?
          if [ "$gh_status" -ne 0 ]; then
            {
              echo "## Dependabot alerts"
              echo
              echo "Query failed (exit ${gh_status}); failing open -- this check saw nothing."
              echo
              echo '```'
              head -c 2000 "$apierr"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::Dependabot alerts query failed (exit ${gh_status}); failing open."
            cat "$apierr"
            exit 0
          fi
          counts="$(jq -r '"\(length) \([.[] | select((.security_advisory.severity // "" | ascii_downcase) == "critical" or (.security_advisory.severity // "" | ascii_downcase) == "high")] | length)"' "$alerts" 2>"$apierr")"
          jq_status=$?
          if [ "$jq_status" -ne 0 ]; then
            {
              echo "## Dependabot alerts"
              echo
              echo "Query succeeded but the response did not parse as JSON; failing open -- this check saw nothing."
              echo
              echo '```'
              head -c 2000 "$apierr"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::Dependabot alerts response did not parse; failing open."
            exit 0
          fi
          total="${counts%% *}"
          blocking="${counts##* }"
          if [ -z "$total" ] || [ -z "$blocking" ]; then
            {
              echo "## Dependabot alerts"
              echo
              echo "Query succeeded but produced no counts; failing open -- this check saw nothing."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::Dependabot alerts counts were empty; failing open."
            exit 0
          fi
          case "$total/$blocking" in
            *[!0-9/]*)
              {
                echo "## Dependabot alerts"
                echo
                echo "Query succeeded but the counts were not numbers; failing open -- this check saw nothing."
              } >>"$GITHUB_STEP_SUMMARY"
              echo "::warning::Dependabot alerts counts were not numbers; failing open."
              exit 0
              ;;
          esac
          rows="$(jq -r '.[] | "\(.security_advisory.severity)\t\(.dependency.package.name)\t\(.security_vulnerability.first_patched_version.identifier // "no patch published")\t\(.html_url)"' "$alerts" 2>"$apierr")"
          jq_status=$?
          if [ "$jq_status" -ne 0 ]; then
            {
              echo "## Dependabot alerts"
              echo
              echo "Query succeeded but the alert rows did not parse; failing open -- this check saw nothing."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::Dependabot alerts rows did not parse; failing open."
            exit 0
          fi
          {
            echo "## Dependabot alerts"
            echo
            if [ "$total" -eq 0 ]; then
              echo "Dependabot: 0 open"
            else
              echo "| Severity | Package | First patched | Alert |"
              echo "| --- | --- | --- | --- |"
              printf '%s\n' "$rows" | while IFS=$'\t' read -r sev pkg patched url; do
                printf '| %s | %s | %s | %s |\n' "$sev" "$pkg" "$patched" "$url"
              done
              echo
              echo "${blocking} of ${total} open alert(s) are critical/high."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$blocking" -gt 0 ]; then
            echo "::error::${blocking} open Dependabot alert(s) with critical/high severity; see the job summary."
            exit 1
          fi
          echo "Dependabot: ${total} open, none critical/high."
          exit 0
