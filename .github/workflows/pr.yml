name: PR gates

on:
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: quotes
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d quotes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERA_POSTGRES_TEST_DSN: postgres://vera:secret@localhost:55432/quotes?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend (required for go:embed)
        run: npm --prefix frontend run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Install PostgreSQL client (matches service version)
        # The restore drill test shells out to pg_dump/pg_restore, which
        # refuse to talk to a newer server — the client major must be 18.
        # Noble has no PG18 package, so take it from PGDG like the image.
        run: |
          sudo apt-get install -y -qq curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18

      - name: go test with race detector
        # -short skips TestGeneratePDF, which needs a Chrome sandbox that
        # GitHub-hosted runners cannot provide. Run it locally without -short.
        run: go test -race -short ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Type-check and build
        run: npm --prefix frontend run build
