name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy readiness
        id: ready
        # Skips cleanly until the owner completes the one-time GCP setup
        # (WIF pool + service account, see docs/api-deploy.md). Secrets are
        # read here at step level, which keeps the workflow parseable in
        # every trigger context; every step below gates on this output.
        run: |
          if [ -z "${{ secrets.GCP_WIF_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GCP deploy secrets not configured; skipping."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        if: steps.ready.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        if: steps.ready.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifact Registry
        if: steps.ready.outputs.ready == 'true'
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build and push (commit SHA tag only)
        if: steps.ready.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.veraserver
          platforms: linux/amd64
          push: true
          tags: asia-southeast1-docker.pkg.dev/vera-app-508411/vera/veraserver:sha-${{ github.sha }}

      - name: Deploy image to Cloud Run
        if: steps.ready.outputs.ready == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vera-api
          region: asia-southeast1
          image: asia-southeast1-docker.pkg.dev/vera-app-508411/vera/veraserver:sha-${{ github.sha }}
          flags: --min-instances=0 --max-instances=2
        # Env vars (incl. DB credentials) persist from the live revision;
        # this step updates the image only and never sees secrets.

      - name: Verify live service
        if: steps.ready.outputs.ready == 'true'
        run: |
          BASE="https://vera-api-171860943410.asia-southeast1.run.app"
          for i in $(seq 1 30); do
            if curl -sf -m 10 "$BASE/health" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = "30" ]; then
              echo "deployed service never became healthy" >&2
              exit 1
            fi
            sleep 10
          done
          CODE=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "$BASE/v1/admin/users")
          if [ "$CODE" != "401" ]; then
            echo "auth gate probe = $CODE, want 401" >&2
            exit 1
          fi
          echo "deploy verified: health OK, auth gate OK"
