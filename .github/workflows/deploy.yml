name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    # A merge that touches only prose does not change the image, so it does not
    # deserve four minutes and a Cloud Run revision.
    #
    # The list is explicit and CHANGELOG.md is deliberately absent. It is copied
    # to backend/api/changelog.md, which is go:embed-ed and served to the app as
    # What's New, so skipping a changelog-only merge would leave every installed
    # copy showing stale release notes. A blanket '**.md' would do exactly that
    # -- see AGENTS.md §14.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "doc/**"
  # So a redeploy does not need an empty commit. Path filters do not apply to a
  # manual dispatch, which is what makes this the escape hatch for the case
  # above: if a doc-only merge ever does need to ship, run it by hand.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Serialise deploys rather than cancelling them.
#
# Two merges close together otherwise run two Cloud Run deploys at once, and the
# live revision becomes whichever build finishes last rather than the newest
# commit. cancel-in-progress is false on purpose: a deploy is not a PR run, and
# aborting one mid-apply leaves the service on a half-rolled revision with no
# signal that it happened.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, deploy
    # Docker build, Artifact Registry push, Cloud Run rollout, then up to five
    # minutes of health polling.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy readiness
        id: ready
        # Skips cleanly until the owner completes the one-time GCP setup
        # (WIF pool + service account, see docs/api-deploy.md). Secrets are
        # read here at step level, which keeps the workflow parseable in
        # every trigger context; every step below gates on this output.
        run: |
          if [ -z "${{ secrets.GCP_WIF_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GCP deploy secrets not configured; skipping."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        if: steps.ready.outputs.ready == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        if: steps.ready.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Artifact Registry
        if: steps.ready.outputs.ready == 'true'
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Log in to GHCR
        # The same image is tagged to GHCR so scripts/deploy.sh's manual
        # rollback fallback keeps working; this replaced build.yml, which
        # built the identical image a second time (#261).
        if: steps.ready.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (commit SHA tag, both registries)
        if: steps.ready.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.veraserver
          platforms: linux/amd64
          push: true
          tags: |
            asia-southeast1-docker.pkg.dev/vera-app-508411/vera/veraserver:sha-${{ github.sha }}
            ghcr.io/arcon-external/vera-app/veraserver:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to Cloud Run
        if: steps.ready.outputs.ready == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: vera-api
          region: asia-southeast1
          image: asia-southeast1-docker.pkg.dev/vera-app-508411/vera/veraserver:sha-${{ github.sha }}
          flags: --min-instances=0 --max-instances=2
        # Env vars (incl. DB credentials) persist from the live revision;
        # this step updates the image only and never sees secrets.

      - name: Verify live service
        if: steps.ready.outputs.ready == 'true'
        run: |
          BASE="https://api.arconpentapersada.co.id"
          for i in $(seq 1 30); do
            if curl -sf -m 10 "$BASE/health" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = "30" ]; then
              echo "deployed service never became healthy" >&2
              exit 1
            fi
            sleep 10
          done
          CODE=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "$BASE/v1/admin/users")
          if [ "$CODE" != "401" ]; then
            echo "auth gate probe = $CODE, want 401" >&2
            exit 1
          fi
          # The legacy run.app URL keeps serving in parallel so installed
          # desktops and printed codes never break; prove it stays up.
          LEGACY="https://vera-api-171860943410.asia-southeast1.run.app"
          LEGACY_CODE=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "$LEGACY/health")
          if [ "$LEGACY_CODE" != "200" ]; then
            echo "legacy host probe = $LEGACY_CODE, want 200" >&2
            exit 1
          fi
          echo "deploy verified: health OK, auth gate OK, legacy host OK"
