name: Server image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push veraserver image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (commit SHA tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.veraserver
          platforms: linux/amd64
          push: true
          tags: ghcr.io/arcon-external/vera-app/veraserver:sha-${{ github.sha }}
