version: 2

# Keeps dependencies and base images fresh, so a pin only moves on purpose.
#
# The run logs already carry the warning this addresses: docker/*@v3 and @v6
# target the deprecated Node 20, and nothing was watching. Before this file
# existed the repository had no version updates at all — Dependabot *alerts*
# work independently of it (AGENTS.md §11 reads them after every merge), so
# security problems surfaced, but nothing proposed an upgrade before a problem
# became one.
#
# All four ecosystems, not just the actions:
#
#   github-actions  the pins in .github/workflows/*.yml
#   docker          Dockerfile.veraserver's builder and runtime images
#   gomod           go.mod — AGENTS.md §16 names x/crypto, pgx/v5 and echo as the
#                   areas most often flagged, and alerts alone means waiting for
#                   a problem to exist before it is fixed
#   npm             frontend/package.json — the vitest@2 -> vitest@5 migration in
#                   §11 was alert-driven; this is what would have caught it early
#
# One thing this cannot see: the postgres:18-alpine service container in pr.yml
# is a workflow input, not a Dockerfile, so the docker ecosystem does not track
# it. Bumping that stays manual.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - development
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - development
    commit-message:
      prefix: "chore"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - development
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - development
    commit-message:
      prefix: "chore"
    ignore:
      # @types/node 26 does not compile here, and it cannot: it uses TypeScript
      # syntax that TypeScript 4.8 (pinned in frontend/package.json) rejects
      # outright -- node_modules/@types/node/ffi.d.ts fails with TS1139 and
      # TS1005 before any of our own code is looked at. Dependabot's first
      # attempt at this (PR #312) went red on both gates.
      #
      # Ignoring the major keeps a permanently-failing PR out of the queue
      # without pretending the dependency is fine. Delete this block when
      # TypeScript moves to 5.x; see the tracking issue.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
